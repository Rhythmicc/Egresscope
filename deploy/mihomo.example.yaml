# Minimal control-plane example. Add proxies, proxy-groups, rules and DNS settings
# for your network before starting the stack.
mixed-port: 9999
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: replace-with-a-long-random-controller-secret

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  strict-route: true

proxies: []
proxy-groups:
  - name: 节点选择
    type: select
    proxies: [DIRECT]
rules:
  - MATCH,节点选择
